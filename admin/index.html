<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>mock1807 · Admin</title>
  <meta name="theme-color" content="#090b0f">
  <link rel="stylesheet" href="admin.css">
</head>
<body>
  <div id="loading" class="center"><div class="loader"></div><p>Checking admin access…</p></div>

  <section id="login" class="center hidden">
    <div class="login-card">
      <div class="mark">1807</div>
      <div class="eyebrow">MOCK1807 · CONTROL CENTER</div>
      <h1>Admin Dashboard</h1>
      <p>Sign in with your authorized Google account to manage tests and view student data.</p>
      <button id="googleBtn" class="primary">Continue with Google</button>
      <div id="loginError" class="error hidden"></div>
      <a href="../" class="back">← Back to student site</a>
    </div>
  </section>

  <div id="app" class="hidden">
    <aside class="sidebar">
      <div class="brand"><span class="brand-dot">18</span><div><b>mock1807</b><small>ADMIN</small></div></div>
      <nav>
        <button class="nav active" data-view="overview">Overview</button>
        <button class="nav" data-view="tests">Tests</button>
        <button class="nav" data-view="students">Students</button>
        <button class="nav" data-view="attempts">Attempts</button>
      </nav>
      <div class="side-bottom">
        <div id="adminIdentity" class="identity"></div>
        <button id="logout" class="logout">Sign out</button>
      </div>
    </aside>

    <main class="main">
      <header class="topbar"><div><div class="eyebrow">CONTROL CENTER</div><h1 id="viewTitle">Overview</h1></div><button id="refresh" class="ghost">↻ Refresh</button></header>
      <div id="toast" class="toast hidden"></div>
      <section id="content"></section>
    </main>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="admin.js"></script>
</body>
</html>
